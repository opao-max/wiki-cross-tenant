name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m compileall -q .

      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 --max-line-length=120 --ignore=E203,W503 --exclude=.git,__pycache__ . || true

      - name: Test
        run: python -m pytest -q --disable-warnings || true
